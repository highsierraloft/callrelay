[project]
name = "callrelay"
version = "0.1.0"
description = "Self-hosted voice calling platform with an Android SIP gateway, MCP tools, and a private dashboard"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "XiyaoWang0519" }, { name = "CallRelay contributors" }]
maintainers = [{ name = "highsierraloft" }]
keywords = [
    "mcp",
    "android",
    "sip",
    "pipecat",
    "self-hosted",
    "voice-agent",
    "fastapi",
    "sip",
    "ai-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
    "Typing :: Typed",
]
dependencies = [
    "aiosqlite>=0.22.1",
    "argon2-cffi>=23.1.0",
    "cryptography>=46.0.0",
    "filelock>=4.2.1",
    "fastapi>=0.141.1",
    "fastmcp>=3.4.10,<4",
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "openai>=2.51.0",
    "phonenumbers>=9.0.37",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.0",
    "tzdata>=2025.2; sys_platform == 'win32'",
    "python-multipart>=0.0.32",
    "twilio>=9.11.0",
    "uvicorn>=0.52.3",
    "websockets>=17.0.1",
]

[project.scripts]
callrelay = "agent_call_console:main"
agent-call = "agent_call_console:main"

[project.urls]
Homepage = "https://github.com/highsierraloft/callrelay"
Repository = "https://github.com/highsierraloft/callrelay"
Issues = "https://github.com/highsierraloft/callrelay/issues"
Documentation = "https://github.com/highsierraloft/callrelay/blob/main/README.md"
Changelog = "https://github.com/highsierraloft/callrelay/blob/main/CHANGELOG.md"
Security = "https://github.com/highsierraloft/callrelay/blob/main/SECURITY.md"

[project.optional-dependencies]
android = [
    "pipecat-ai[openai]==1.14.0",
    "pipecat-asterisk==0.1.4",
]

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.1",
    "types-protobuf>=6.30.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/app",
    "/scripts/agent_call_console.py",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Installed as a real site-packages module so `uv run agent-call` works when
# Python skips hidden editable `.pth` files for console scripts.
[tool.hatch.build.targets.wheel.force-include]
"scripts/agent_call_console.py" = "agent_call_console.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
# Security floors for the transitive application graph.
constraint-dependencies = [
    "aiohttp>=3.14.4", "certifi>=2026.10.19", "mcp>=1.30.0,<2",
    "multidict>=6.9.1", "opentelemetry-api>=1.45.1", "pillow>=13.0.0",
    "pyjwt>=2.15.0", "urllib3>=2.8.0",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Gates regressions in CI (`pytest --cov=app`) without affecting plain
# `uv run pytest`, which doesn't load coverage at all.
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "FIX"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true
packages = ["app"]
exclude = [
    "tests/",
    "scripts/",
    "dist/",
]

# Third-party packages without complete stubs.
[[tool.mypy.overrides]]
module = [
    "twilio.*",
    "phonenumbers.*",
    "fastmcp.*",
    "aiosqlite.*",
]
ignore_missing_imports = true
